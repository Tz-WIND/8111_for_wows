[project]
name = "wows-8111-extractor"
version = "0.1.0"
description = "8111-style HTTP + WebSocket telemetry server for World of Warships"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.10",
]

# This project ships a runnable app (server/server.py), not an importable
# library, so tell uv not to try to build/install it as a package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
