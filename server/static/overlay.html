<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoWS Minimap Overlay</title>
<style>
  :root { --ally:#46e0a0; --enemy:#ff5d5d; --self:#ffd24a; --grid:#1d2c33; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0a1014; color:#cfe3ea;
               font:13px/1.4 "Segoe UI", system-ui, Arial; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #map { background:#0c161c; box-shadow:0 0 0 1px #20323b, 0 10px 40px rgba(0,0,0,.6);
         border-radius:6px; }
  #hud { position:fixed; top:12px; left:12px; padding:10px 12px; background:rgba(8,16,20,.78);
         border:1px solid #20323b; border-radius:8px; min-width:210px; backdrop-filter:blur(4px); }
  #hud h1 { margin:0 0 6px; font-size:14px; letter-spacing:.4px; }
  #hud .row { display:flex; justify-content:space-between; gap:14px; }
  #hud .row span:last-child { color:#fff; font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  #status { margin-top:6px; font-size:12px; }
  #status.ok { color:var(--ally); } #status.bad { color:var(--enemy); }
  #legend { position:fixed; bottom:12px; left:12px; padding:8px 12px; background:rgba(8,16,20,.78);
            border:1px solid #20323b; border-radius:8px; font-size:12px; }
  #scoreLine { margin-top:6px; font-size:12px; color:#9fb6c0; }
</style>
</head>
<body>
<div id="wrap"><canvas id="map"></canvas></div>

<div id="hud">
  <h1>8111 &middot; WoWS Overlay</h1>
  <div class="row"><span>Map</span><span id="mapName">-</span></div>
  <div class="row"><span>Mode</span><span id="battleType">-</span></div>
  <div class="row"><span>Ships</span><span id="shipCount">0</span></div>
  <div class="row"><span>Allies</span><span id="allyInfo">-</span></div>
  <div class="row"><span>Enemies</span><span id="enemyInfo">-</span></div>
  <div class="row"><span>Last-seen</span><span id="ghostCount">0</span></div>
  <div class="row"><span>Bounds</span><span id="boundsMode">auto-fit</span></div>
  <div id="scoreLine"></div>
  <div id="status" class="bad">connecting&hellip;</div>
</div>

<div id="legend">
  <span class="dot" style="background:var(--ally)"></span>Ally
  <span class="dot" style="background:var(--enemy)"></span>Enemy
  <span class="dot" style="background:var(--self)"></span>You
  <span class="dot" style="background:transparent;border:1px dashed #9aa7ad"></span>Last seen
</div>

<script>
"use strict";
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let snap = null;                    // latest /all snapshot
let fit = null;                     // smoothed auto-fit bounds {minX,maxX,minZ,maxZ}
const GHOST_MAX = 45;               // hide a last-seen marker after this many seconds
const $ = id => document.getElementById(id);

// ---- canvas sizing (square, fits viewport) --------------------------------
function resize() {
  const m = Math.min(window.innerWidth, window.innerHeight) - 40;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = canvas.style.height = m + "px";
  canvas.width = canvas.height = Math.round(m * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas._css = m;
}
window.addEventListener("resize", resize);
resize();

// ---- coordinate mapping ---------------------------------------------------
// Prefer server-provided nx/ny (uses real map bounds). Otherwise auto-fit from
// world x/z, smoothing the bounds so the view doesn't jitter frame to frame.
function updateAutoFit(objects) {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity, any = false;
  const consider = (x, z) => {
    if (typeof x !== "number" || typeof z !== "number") return;
    any = true;
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
  };
  for (const o of objects) { consider(o.x, o.z); consider(o.lastX, o.lastZ); }
  if (!any) return;
  // pad + keep square
  const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
  let half = Math.max(maxX - minX, maxZ - minZ) / 2 * 1.25;
  half = Math.max(half, 2000);
  const target = { minX: cx - half, maxX: cx + half, minZ: cz - half, maxZ: cz + half };
  if (!fit) { fit = target; return; }
  const a = 0.08;  // smoothing
  for (const k in target) fit[k] += (target[k] - fit[k]) * a;
}

function projectCoords(nx, ny, x, z) {
  const m = canvas._css;
  if (typeof nx === "number" && typeof ny === "number") return [nx * m, ny * m];
  if (fit && typeof x === "number" && typeof z === "number") {
    const NX = (x - fit.minX) / (fit.maxX - fit.minX);
    const NY = 1 - (z - fit.minZ) / (fit.maxZ - fit.minZ);
    return [NX * m, NY * m];
  }
  return null;
}
function project(o) { return projectCoords(o.nx, o.ny, o.x, o.z); }
function projectLast(o) { return projectCoords(o.lastNx, o.lastNy, o.lastX, o.lastZ); }

// ---- drawing --------------------------------------------------------------
function colorFor(o, selfId) {
  if (selfId != null && o.playerId === selfId) return getCss("--self");
  if (o.relation === 1) return getCss("--ally");
  if (o.relation === 2) return getCss("--enemy");
  return "#9aa7ad";
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function draw() {
  const m = canvas._css;
  ctx.clearRect(0, 0, m, m);

  // grid (10x10, WoWS-like)
  ctx.strokeStyle = getCss("--grid"); ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 10; i++) {
    const p = Math.round(i * m / 10) + 0.5;
    ctx.moveTo(p, 0); ctx.lineTo(p, m);
    ctx.moveTo(0, p); ctx.lineTo(m, p);
  }
  ctx.stroke();

  if (!snap) return;
  const objects = snap.objects || [];
  if (!hasServerBounds()) updateAutoFit(objects);
  const selfId = snap.self && snap.self.playerId;

  for (const o of objects) {
    // alive may be false or 0; zero HP wrecks must not become 灭点 ghosts
    if (o.alive === false || o.alive === 0) continue;
    if (typeof o.health === "number" && o.health <= 0) continue;
    const r = (o.type === "Battleship") ? 6 : (o.type === "Destroyer") ? 4 : 5;
    const col = colorFor(o, selfId);
    const live = (o.visible !== false) && (typeof o.nx === "number" || typeof o.x === "number");

    if (!live) {
      // last-seen ghost: dashed, faded marker at the last known spot
      const stale = (typeof o.staleSeconds === "number") ? o.staleSeconds : 0;
      const hasLast = (typeof o.lastNx === "number") || (typeof o.lastX === "number");
      if (!hasLast || stale > GHOST_MAX) continue;
      if (typeof o.lastHealth === "number" && o.lastHealth <= 0) continue;
      const p = projectLast(o);
      if (!p) continue;
      const [x, y] = p;
      ctx.globalAlpha = Math.max(0.12, 0.5 * (1 - stale / GHOST_MAX));
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      if (typeof o.lastYaw === "number") {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.sin(o.lastYaw) * (r + 8), y - Math.cos(o.lastYaw) * (r + 8));
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      if (o.name) {
        ctx.fillStyle = "rgba(200,215,222,.5)";
        ctx.font = "9px Segoe UI, sans-serif";
        ctx.fillText(o.name + " " + Math.round(stale) + "s", x + r + 3, y + 3);
      }
      continue;
    }

    const p = project(o);
    if (!p) continue;
    const [x, y] = p;

    // heading wedge
    if (typeof o.yaw === "number") {
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.sin(o.yaw) * (r + 9), y - Math.cos(o.yaw) * (r + 9));
      ctx.stroke();
    }
    // body
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.globalAlpha = (typeof o.hpRatio === "number") ? (0.35 + 0.65 * o.hpRatio) : 1;
    ctx.fill();
    ctx.globalAlpha = 1;
    if (selfId != null && o.playerId === selfId) {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.stroke();
    }
    // label
    if (o.name) {
      ctx.fillStyle = "rgba(255,255,255,.82)";
      ctx.font = "10px Segoe UI, sans-serif";
      ctx.fillText(o.name, x + r + 3, y + 3);
    }
  }
}

function hasServerBounds() {
  return snap && Array.isArray(snap.bounds) && snap.bounds.length === 4;
}

function render() {
  if (snap) {
    $("mapName").textContent = (snap.map && snap.map.name) || "(unknown)";
    $("battleType").textContent = snap.battleType || "-";
    const alive = (snap.objects || []).filter(o =>
      o.alive !== false && o.alive !== 0 &&
      !(typeof o.health === "number" && o.health <= 0));
    const liveN = alive.filter(o =>
      o.visible !== false && (typeof o.nx === "number" || typeof o.x === "number")).length;
    const ghostN = alive.filter(o =>
      o.visible === false && ((typeof o.lastNx === "number") || (typeof o.lastX === "number")) &&
      !(typeof o.lastHealth === "number" && o.lastHealth <= 0) &&
      (typeof o.staleSeconds !== "number" || o.staleSeconds <= GHOST_MAX)).length;
    $("shipCount").textContent = liveN;
    $("ghostCount").textContent = ghostN;
    const d = snap.diag;
    if (d) {
      $("allyInfo").textContent = d.alliesVisible + "/" + d.allies + " spotted";
      $("enemyInfo").textContent = d.enemiesVisible + "/" + d.enemies + " spotted";
    } else {
      const allyN = alive.filter(o => o.relation === 1).length;
      const enemyN = alive.filter(o => o.relation === 2).length;
      $("allyInfo").textContent = allyN;
      $("enemyInfo").textContent = enemyN;
    }
    $("boundsMode").textContent = hasServerBounds()
      ? (snap.boundsSource === "runtime" ? "from map (live)"
         : snap.boundsSource === "table" ? "from map (recognized)"
         : "from map")
      : "auto-fit";
    const dmg = snap.damage && snap.damage.teamTotal;
    if (dmg && Object.keys(dmg).length) {
      $("scoreLine").textContent = "Team dmg: " +
        Object.entries(dmg).map(([t, v]) => `T${t}=${Math.round(v)}`).join("  ");
    } else { $("scoreLine").textContent = ""; }
  }
  draw();
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// ---- transport: WebSocket with polling fallback ---------------------------
function setStatus(ok, text) {
  const el = $("status");
  el.className = ok ? "ok" : "bad";
  el.textContent = text;
}

function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws`;
  let ws;
  try { ws = new WebSocket(url); }
  catch (e) { return startPolling(); }

  ws.onopen = () => setStatus(true, "live (websocket)");
  ws.onmessage = ev => { try { snap = JSON.parse(ev.data); } catch (e) {} };
  ws.onerror = () => {};
  ws.onclose = () => {
    setStatus(false, "reconnecting&hellip;");
    setTimeout(connectWS, 1000);
  };
}

let pollTimer = null;
function startPolling() {
  if (pollTimer) return;
  setStatus(true, "live (polling)");
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch("/all", { cache: "no-store" });
      snap = await r.json();
    } catch (e) { setStatus(false, "no server"); }
  }, 200);
}

connectWS();
</script>
</body>
</html>
