# ============================================================
#  8111 for WoWS -- server (server.py) settings
# ------------------------------------------------------------
#  Copy this file to config.ini and edit values for your machine.
#  Read by server/server.py at startup. Command-line flags
#  (e.g. run_server.bat --demo) override anything set here.
#  Format: one "key = value" per line; '#' or ';' starts a comment.
#
#  NOTE: the in-game collector's update rate lives in a separate file:
#     mod/PnFMods/WowsExtractor/config.ini  (state_interval)
# ============================================================

# World of Warships install folder. The server auto-locates state.json at
#   <game_dir>/bin/<latest-build>/res_mods/PnFMods/WowsExtractor/state.json
game_dir = C:\Program Files\World_of_Warships

# HTTP / WebSocket listen address and port.
# (Change the port if it clashes with something else, e.g. War Thunder's 8111.)
host = 127.0.0.1
port = 8111

# How often (seconds) the server re-reads state.json from disk.
# Keep this <= the mod's state_interval so you don't miss frames.
poll_interval = 0.1

# Optional overrides -- normally leave blank and rely on game_dir auto-find:
# state_file = C:\Program Files\World_of_Warships\bin\<build>\res_mods\PnFMods\WowsExtractor\state.json
# meta_file  =
